<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Member Management - ROSENFRANC DT SACCO</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f7fb;
      margin: 0;
    }

    header {
      background: linear-gradient(90deg, #0b3d91, #4fc3f7);
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
    }

    th {
      background: #0b3d91;
      color: white;
    }

    button {
      background: #aeea00;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h2>MEMBER MANAGEMENT SYSTEM</h2>
</header>

<div class="container">

  <h3>Add New Member</h3>

  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="idno" placeholder="ID Number">
  <input type="text" id="phone" placeholder="Phone Number">

  <button onclick="addMember()">Add Member</button>

  <table>
    <thead>
      <tr>
        <th>Member ID</th>
        <th>Name</th>
        <th>ID Number</th>
        <th>Phone</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="memberTable"></tbody>
  </table>

</div>

<script src="../js/members.js"></script>

</body>
</html>
